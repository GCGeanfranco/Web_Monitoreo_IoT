name: CI/CD - Tesis IoT API

on:
  push:
    branches: [ main ]

jobs:
  test:
    name: 🧪 Tests automáticos
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        working-directory: ./iot-api
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Ejecutar tests
        working-directory: ./iot-api
        env:
          # SQLite descartable — los tests NUNCA deben tocar la base de producción (Neon).
          # test_post_lectura_transformador() inserta una fila real; con el DATABASE_URL
          # de producción, esa fila quedaba en la tabla de lecturas del transformador
          # y aparecía en el dashboard como si fuera una lectura real del ESP32.
          DATABASE_URL: sqlite:///./test_ci.db
        run: pytest tests/ -v

  deploy:
    name: 🚀 Deploy a Railway
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Notificar deploy exitoso
        run: echo "✅ Tests pasaron - Railway despliega automáticamente via GitHub"

